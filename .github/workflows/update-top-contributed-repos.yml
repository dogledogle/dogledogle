name: Update top contributed repositories

on:
  workflow_dispatch:

  schedule:
    # Every Monday at 02:17 UTC, which is 10:17 in Hong Kong.
    - cron: "17 2 * * 1"

permissions:
  contents: write

concurrency:
  group: update-top-contributed-repositories
  cancel-in-progress: true

jobs:
  update:
    if: github.repository == 'dogledogle/dogledogle'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Generate repository badges
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/update-top-contributed-repos.ps1 `
            -UserName "dogledogle" `
            -TopCount 5 `
            -ReadmePath "README.md"

      - name: Commit updated README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README is already up to date."
            exit 0
          fi

          git commit -m "chore: update top contributed repositories"
          git push
